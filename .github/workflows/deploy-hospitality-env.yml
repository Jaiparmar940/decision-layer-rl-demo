name: Deploy hospitality-env to snlabs.dev

on:
  push:
    branches: [demo/live-video]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-snlabs-hospitality-env
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (GitHub Pages base)
        run: |
          npx tsc --noEmit
          npx vite build --base /hospitality-env/
          bash scripts/ci-guard-bundle.sh

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: Jaiparmar940/second-nature-site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site

      - name: Publish hospitality-env/
        run: |
          rm -rf site/hospitality-env
          mkdir -p site/hospitality-env
          cp -R dist/. site/hospitality-env/
          touch site/hospitality-env/.nojekyll

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hospitality-env
          if git diff --staged --quiet; then
            echo "No site changes to publish"
            exit 0
          fi
          git commit -m "Deploy hospitality-env from decision-layer-rl-demo@${GITHUB_SHA}"
          git push origin HEAD:main
